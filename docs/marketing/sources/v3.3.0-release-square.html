<!-- Fonts are vendored in sources/fonts/ (Baloo 2 + Nunito, latin, from the
     @fontsource npm packages) so this file renders identically offline and in any
     sandbox. It previously pulled Google Fonts, which silently fell back to a wider
     system face wherever that host was unreachable — and the fallback overflows the
     layout. Do not reintroduce the remote link. -->
<style>
  @font-face{font-family:'Baloo 2';font-style:normal;font-weight:500;font-display:block;src:url('fonts/baloo-2-latin-500-normal.woff2') format('woff2')}
  @font-face{font-family:'Baloo 2';font-style:normal;font-weight:600;font-display:block;src:url('fonts/baloo-2-latin-600-normal.woff2') format('woff2')}
  @font-face{font-family:'Baloo 2';font-style:normal;font-weight:700;font-display:block;src:url('fonts/baloo-2-latin-700-normal.woff2') format('woff2')}
  @font-face{font-family:'Baloo 2';font-style:normal;font-weight:800;font-display:block;src:url('fonts/baloo-2-latin-800-normal.woff2') format('woff2')}
  :root{
    --bg1:#241a39; --bg2:#3a2b5c; --bg3:#1a1228;
    --rose:#f48fb1; --rose-d:#e8709a; --cyan:#3cd9ff; --mauve-l:#c4a6e8;
    --cream:#f6f0ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#120d1c;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .card{
    position:relative;width:1080px;height:1080px;flex:none;overflow:hidden;border-radius:28px;
    font-family:'Baloo 2','Segoe UI',system-ui,sans-serif;color:var(--cream);
    background:
      radial-gradient(circle at 50% 30%, rgba(122,86,168,.55) 0%, rgba(58,43,92,0) 58%),
      radial-gradient(circle at 12% 88%, rgba(60,217,255,.10) 0%, rgba(0,0,0,0) 45%),
      linear-gradient(165deg,#2a1f45 0%, var(--bg1) 42%, var(--bg3) 100%);
  }
  /* --- decorative bits --- */
  .deco{position:absolute;line-height:1;user-select:none}
  .dot{position:absolute;border-radius:50%}
  /* --- header --- */
  .head{position:absolute;top:52px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:20px}
  .duo-heads{width:82px;height:auto;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
  .wordmark{font-size:66px;font-weight:800;letter-spacing:-.5px;line-height:1}
  .wordmark .a{color:#fdf7ff}
  .wordmark .b{color:var(--rose)}
  .ver{
    font-size:26px;font-weight:700;color:var(--rose);padding:6px 22px 9px;border-radius:999px;
    border:2.5px solid rgba(244,143,177,.55);background:rgba(244,143,177,.08);
  }
  /* --- mascots --- */
  .stage{position:absolute;top:150px;left:0;right:0;height:336px;display:flex;align-items:flex-end;justify-content:center}
  .halo{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:620px;height:420px;border-radius:50%;
        background:radial-gradient(circle,rgba(160,120,220,.30) 0%,rgba(160,120,220,0) 68%);filter:blur(6px)}
  .duo-body{width:452px;height:auto;display:block;position:relative;filter:drop-shadow(0 22px 34px rgba(0,0,0,.42))}
  .flag{position:absolute;font-size:72px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}
  .flag.fr{left:150px;top:96px;transform:rotate(-8deg)}
  .flag.ca{right:150px;top:78px;transform:rotate(7deg)}
  /* Belgium and Switzerland ride along — the regional card covers them too */
  .flag.sm{font-size:46px;filter:drop-shadow(0 5px 10px rgba(0,0,0,.45))}
  .flag.be{left:96px;top:286px;transform:rotate(-14deg)}
  .flag.ch{right:104px;top:300px;transform:rotate(11deg)}
  .globe{position:absolute;right:236px;bottom:-12px;font-size:96px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
  /* --- copy --- */
  .body{position:absolute;top:494px;left:0;right:0;text-align:center;padding:0 62px}
  .eyebrow{font-size:28px;font-weight:700;letter-spacing:7px;color:var(--cyan);text-transform:uppercase;
           text-shadow:0 0 26px rgba(60,217,255,.45)}
  .hero{
    margin-top:6px;font-size:100px;font-weight:800;line-height:1.04;letter-spacing:-1px;
    background:linear-gradient(93deg,var(--rose) 0%,#f6a8c8 38%,#c9a6ef 72%,#b98ef0 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 6px 26px rgba(244,143,177,.28));
  }
  .sub{margin-top:14px;font-size:31px;font-weight:500;line-height:1.32;color:#e8dff5}
  .sub b{color:var(--rose);font-weight:700}
  .chip{
    margin:18px auto 0;display:inline-flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center;
    padding:16px 32px;border-radius:22px;background:rgba(255,255,255,.055);
    border:1.5px solid rgba(255,255,255,.10);font-size:27px;font-weight:600;color:#cdbfe4;
    box-shadow:0 10px 30px rgba(0,0,0,.25) inset, 0 6px 18px rgba(0,0,0,.18);
  }
  .chip .w{color:var(--cyan);font-weight:700}
  .chip .y{color:#fdf7ff;font-weight:700}
  .cta{margin-top:14px;font-size:36px;font-weight:800;color:var(--rose)}
  .url{
    position:absolute;bottom:46px;left:50%;transform:translateX(-50%);
    display:inline-flex;align-items:center;gap:18px;
    padding:15px 48px 18px;border-radius:999px;border:3px solid rgba(244,143,177,.65);
    background:rgba(244,143,177,.07);font-size:38px;font-weight:700;color:#fdf7ff;white-space:nowrap;
    box-shadow:0 0 34px rgba(244,143,177,.16);
  }
</style>
</head>
