<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<!-- Fonts are vendored in sources/fonts/ (Baloo 2 + Nunito, latin, from the
     @fontsource npm packages) so this file renders identically offline and in any
     sandbox. It previously pulled Google Fonts, which silently fell back to a wider
     system face wherever that host was unreachable — and the fallback overflows the
     layout. Do not reintroduce the remote link. -->
<style>
  @font-face{font-family:'Baloo 2';font-style:normal;font-weight:500;font-display:block;src:url('fonts/baloo-2-latin-500-normal.woff2') format('woff2')}

  @font-face{font-family:'Baloo 2';font-style:normal;font-weight:800;font-display:block;src:url('fonts/baloo-2-latin-800-normal.woff2') format('woff2')}
  @font-face{font-family:'Nunito';font-style:normal;font-weight:600;font-display:block;src:url('fonts/nunito-latin-600-normal.woff2') format('woff2')}
  @font-face{font-family:'Nunito';font-style:normal;font-weight:700;font-display:block;src:url('fonts/nunito-latin-700-normal.woff2') format('woff2')}

  html,body{margin:0;background:#08060f;font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;}
  #banner{position:relative;width:1640px;height:856px;overflow:hidden;background:#cfe6db;}
  #stage{position:absolute;inset:0;}
  svg{position:absolute;inset:0;width:100%;height:100%;}
  .brand{position:absolute;left:48px;top:100px;display:flex;align-items:center;gap:10px;z-index:5;}
  .brand svg{position:static;width:60px;height:52px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.55));}
  .wm{font-weight:800;font-size:28px;letter-spacing:.4px;line-height:1;text-shadow:0 2px 12px rgba(10,30,20,.75);}
  .wm .a{color:#FFFFFF;}.wm .b{color:#FFC6DA;}
  .headline{position:absolute;left:50px;top:156px;z-index:5;font-weight:800;font-size:38px;line-height:1.03;color:#FFFFFF;text-shadow:0 3px 16px rgba(8,26,18,.9);}
  .headline .g{color:#BFF7D6;}
  .sub{position:absolute;left:52px;top:242px;z-index:5;font-family:'Nunito',system-ui,sans-serif;font-weight:700;font-size:15px;color:#EAFBF1;max-width:425px;line-height:1.4;text-shadow:0 2px 10px rgba(8,26,18,1);}
  .pill{position:absolute;left:52px;top:296px;z-index:5;display:inline-flex;align-items:center;gap:8px;font-family:'Nunito',system-ui,sans-serif;font-weight:700;font-size:15px;color:#FFFFFF;background:rgba(20,50,36,.5);border:2px solid rgba(255,255,255,.6);border-radius:999px;padding:6px 14px;}
  /* One line, hard against the top edge on the right. Facebook's narrow banner crop cuts
     the top of this image off entirely, and the canopy grows upward every release — a
     stacked box parked mid-canvas was going to be swallowed by trees sooner or later. */
  .legend{position:absolute;right:26px;top:0;z-index:5;display:flex;flex-direction:row;gap:22px;align-items:center;font-family:'Nunito',system-ui,sans-serif;font-weight:700;font-size:15px;color:#FFFFFF;background:rgba(24,44,30,.72);border:1px solid rgba(255,255,255,.22);border-top:none;border-radius:0 0 16px 16px;padding:8px 20px 9px;}
  .legend span{display:flex;align-items:center;gap:9px;white-space:nowrap;}
  .legend .ic{position:static;width:26px;height:26px;flex:none;}
</style>
</head>

    <span><svg class="ic" viewBox="0 0 26 26"><rect x="12" y="3.4" width="2.2" height="3.4" rx="1.1" fill="#7E8C74"/><path d="M6.4 11 a6.6 7 0 0 0 13.2 0 Z" fill="#CFD9C6" stroke="#7E8C74" stroke-width="0.7" stroke-dasharray="1.7,1.3"/><ellipse cx="13" cy="10.4" rx="7.7" ry="3.9" fill="#7E8C74"/><path d="M5.3 10.4 a7.7 3.9 0 0 1 15.4 0" fill="none" stroke="#EAF1E4" stroke-width="1"/><text x="13" y="16.7" text-anchor="middle" font-family="'Baloo 2'" font-weight="800" font-size="9" fill="#EAF1E4">AB</text></svg> planned</span>

<script>
const NS="http://www.w3.org/2000/svg";
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const rad=d=>d*Math.PI/180;
const svg=document.getElementById("svg");
let _s=90210; const rng=()=>{_s=(_s*1664525+1013904223)>>>0;return _s/4294967296;};
const jit=(a,b)=>a+(b-a)*rng();

el("defs",{},svg).innerHTML=`
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e7eee9"/><stop offset="45%" stop-color="#cfe6da"/><stop offset="100%" stop-color="#bfe0c9"/></linearGradient>
  <radialGradient id="sun" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff6d8" stop-opacity=".95"/><stop offset="45%" stop-color="#ffe6a8" stop-opacity=".4"/><stop offset="100%" stop-color="#ffe6a8" stop-opacity="0"/></radialGradient>
  <radialGradient id="cBack" cx="42%" cy="34%" r="72%"><stop offset="0%" stop-color="#3f9e68"/><stop offset="100%" stop-color="#236b45"/></radialGradient>
  <radialGradient id="cMid" cx="40%" cy="26%" r="74%"><stop offset="0%" stop-color="#9CEFC0"/><stop offset="50%" stop-color="#58c88a"/><stop offset="100%" stop-color="#31905d"/></radialGradient>
  <radialGradient id="cMid2" cx="40%" cy="26%" r="74%"><stop offset="0%" stop-color="#B6F2C8"/><stop offset="50%" stop-color="#6bcf8e"/><stop offset="100%" stop-color="#379a60"/></radialGradient>
  <radialGradient id="cMist" cx="45%" cy="35%" r="70%"><stop offset="0%" stop-color="#bfe0cf"/><stop offset="100%" stop-color="#9ec9b0"/></radialGradient>
  <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6e4d34"/><stop offset="50%" stop-color="#946c49"/><stop offset="100%" stop-color="#5a3d28"/></linearGradient>
  <radialGradient id="acorn" cx="40%" cy="28%" r="75%"><stop offset="0%" stop-color="#F5C878"/><stop offset="60%" stop-color="#E8A94E"/><stop offset="100%" stop-color="#B77C34"/></radialGradient>
  <linearGradient id="hill" x1="0" y1="0" x2="0.2" y2="1"><stop offset="0%" stop-color="#8fc06a"/><stop offset="42%" stop-color="#5f9a4a"/><stop offset="100%" stop-color="#356234"/></linearGradient>
  <linearGradient id="path" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#dcb782"/><stop offset="100%" stop-color="#b98c56"/></linearGradient>
  <radialGradient id="scrim" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="rgba(12,34,22,0.62)"/><stop offset="55%" stop-color="rgba(12,34,22,0.34)"/><stop offset="100%" stop-color="rgba(12,34,22,0)"/></radialGradient>
  <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#bfe8f4"/><stop offset="50%" stop-color="#5cc0dd"/><stop offset="100%" stop-color="#2b86b2"/></linearGradient>
  <radialGradient id="leafGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#BFF7D6" stop-opacity=".35"/><stop offset="100%" stop-color="#BFF7D6" stop-opacity="0"/></radialGradient>
  <radialGradient id="goldGlow" cx="50%" cy="46%" r="50%"><stop offset="0%" stop-color="#FFEEB0" stop-opacity=".9"/><stop offset="45%" stop-color="#F6C560" stop-opacity=".4"/><stop offset="100%" stop-color="#F6C560" stop-opacity="0"/></radialGradient>
  <linearGradient id="goldPlate" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F9D585"/><stop offset="100%" stop-color="#D69A34"/></linearGradient>
  <radialGradient id="goldNut" cx="38%" cy="26%" r="74%"><stop offset="0%" stop-color="#FFF3AE"/><stop offset="48%" stop-color="#FFD23F"/><stop offset="100%" stop-color="#DFA015"/></radialGradient>
  <radialGradient id="greenNut" cx="38%" cy="26%" r="74%"><stop offset="0%" stop-color="#C5F5D6"/><stop offset="48%" stop-color="#57c68a"/><stop offset="100%" stop-color="#2c8f57"/></radialGradient>
  <radialGradient id="brownNut" cx="38%" cy="26%" r="76%"><stop offset="0%" stop-color="#9A6E45"/><stop offset="46%" stop-color="#5E3E24"/><stop offset="100%" stop-color="#34220f"/></radialGradient>
  <radialGradient id="paleNut" cx="38%" cy="26%" r="76%"><stop offset="0%" stop-color="#F2F6EE"/><stop offset="48%" stop-color="#CFD9C6"/><stop offset="100%" stop-color="#A7B49C"/></radialGradient>`;

el("rect",{x:0,y:0,width:1640,height:856,fill:"url(#sky)"},svg);
// SUN — moved to the LEFT (soft warm morning light)
el("circle",{cx:250,cy:210,r:300,fill:"url(#sun)"},svg);
el("circle",{cx:250,cy:210,r:66,fill:"#fff3cf",opacity:.9},svg);
// birds, right side
[[1120,120],[1165,132],[1300,96],[1345,108]].forEach(b=>el("path",{d:`M${b[0]-9},${b[1]} q9,-8 9,0 q0,-8 9,0`,fill:"none",stroke:"#5a7a63","stroke-width":2.4,opacity:.5},svg));

// ---------- big wide HILL the path climbs ----------
const HILL="M0,405 C 240,323 470,171 760,131 C 1010,97 1240,197 1640,253 L1640,856 L0,856 Z";
// misty distant trees peeking beyond the crest
for(let i=0;i<11;i++){const x=360+i*110+jit(-20,20),y=jit(85,145),r=jit(40,66);
  el("ellipse",{cx:x,cy:y,rx:r,ry:r*0.82,fill:"url(#cMist)",opacity:.5},svg);
  el("rect",{x:x-4,y:y,width:8,height:34,fill:"#9ec9b0",opacity:.35},svg);}
el("path",{d:HILL,fill:"url(#hill)"},svg);
// soft light band down the hill
el("path",{d:"M0,405 C 240,323 470,171 760,131 C 1010,97 1240,197 1640,253 L1640,295 C1240,235 1010,143 760,179 C470,217 240,367 0,451 Z",fill:"#a6d07a",opacity:.35},svg);
// text scrim (over the sun so white text stays legible)
el("ellipse",{cx:235,cy:220,rx:450,ry:240,fill:"url(#scrim)"},svg);

// ---------- path climbing the hill ----------

const clipDefs=el("defs",{},svg);
const hillClip=el("clipPath",{id:"hillClip"},clipDefs);
el("path",{d:HILL},hillClip);
const CLEARING={cx:965,cy:406,rx:122,ry:46};
const ROUTES=[{"name":"main-SW","w0":62,"w1":9,"cp":[[-150,916],[-16,864],[96,808],[176,746],[248,676],[318,620],[400,596],[486,560],[556,532],[634,486],[714,468],[802,430],[888,412],[930,406]]},{"name":"SE","w0":44,"w1":8,"cp":[[1790,904],[1664,846],[1558,784],[1470,722],[1418,650],[1398,578],[1348,518],[1268,470],[1178,440],[1080,418],[1012,408]]},{"name":"over-the-crest","w0":7,"w1":24,"cp":[[300,120],[340,168],[368,204],[396,238],[424,266],[450,304],[494,336],[554,362],[628,384],[706,394],[792,400],[876,404],[935,406]]},{"name":"NE","w0":34,"w1":7,"cp":[[1780,292],[1650,304],[1522,320],[1400,336],[1280,354],[1172,372],[1082,390],[1020,400]]}];
function catmull(pts,seg){const out=[];
  for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||pts[i+1];
    for(let j=0;j<seg;j++){const t=j/seg,t2=t*t,t3=t2*t;
      out.push([0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
                0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)]);}}
  out.push(pts[pts.length-1]);return out;}
function arcOf(cp){
  const SP=catmull(cp,20),SL=[];let TOT=0;
  for(let i=0;i<SP.length-1;i++){const dx=SP[i+1][0]-SP[i][0],dy=SP[i+1][1]-SP[i][1],L=Math.hypot(dx,dy);SL.push({x:SP[i][0],y:SP[i][1],dx,dy,L});TOT+=L;}
  return {at:t=>{let d=t*TOT;for(let i=0;i<SL.length;i++){if(d<=SL[i].L||i===SL.length-1){const f=Math.min(d/SL[i].L,1);return{x:SL[i].x+SL[i].dx*f,y:SL[i].y+SL[i].dy*f};}d-=SL[i].L;}}};
}
// a trodden path is not a wedge — let it breathe a little along its length
const routeW=(r,t)=>(r.w0*(1-t)+r.w1*t)*(1+0.10*Math.sin(t*8.2+0.6)+0.05*Math.sin(t*17.4));
const PATHSAMP=[];
ROUTES.forEach(r=>{
  const A=arcOf(r.cp), N=260, lp=[], rp=[];
  for(let k=0;k<=N;k++){const t=k/N,p=A.at(t),pn=A.at(Math.min(1,t+0.004));
    const dx=pn.x-p.x,dy=pn.y-p.y,n=Math.hypot(dx,dy)||1,tx=dx/n,ty=dy/n,w=routeW(r,t);
    lp.push([p.x-ty*w/2,p.y+tx*w/2]);rp.push([p.x+ty*w/2,p.y-tx*w/2]);}
  // midpoint-quadratic smoothing: straight segments between samples faceted the curves
  const sm=pts=>{let d="";for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];d+=" Q"+a[0].toFixed(1)+","+a[1].toFixed(1)+" "+((a[0]+b[0])/2).toFixed(1)+","+((a[1]+b[1])/2).toFixed(1);}return d;};
  const rev=rp.slice().reverse();
  const dd="M"+lp[0][0].toFixed(1)+","+lp[0][1].toFixed(1)+sm(lp)
    +" Q"+((lp[N][0]+rev[0][0])/2).toFixed(1)+","+((lp[N][1]+rev[0][1])/2-3).toFixed(1)+" "+rev[0][0].toFixed(1)+","+rev[0][1].toFixed(1)
    +sm(rev)+" Z";
  el("path",{d:dd,fill:"url(#path)","clip-path":"url(#hillClip)"},svg);
  el("path",{d:dd,fill:"none",stroke:"#a37e4f","stroke-width":r.w0>50?2:1.4,opacity:.35,"clip-path":"url(#hillClip)"},svg);
  for(let k=0;k<=110;k++){const t=k/110,p=A.at(t);PATHSAMP.push({x:p.x,y:p.y,w:routeW(r,t)});}
});
// the clearing draws LAST so the thin tapered ends disappear into it — four
// spindly lines meeting at a point is exactly what reads as a road junction
el("ellipse",{cx:CLEARING.cx,cy:CLEARING.cy,rx:CLEARING.rx*1.16,ry:CLEARING.ry*1.2,fill:"url(#path)",opacity:.45},svg);
el("ellipse",{cx:CLEARING.cx,cy:CLEARING.cy,rx:CLEARING.rx,ry:CLEARING.ry,fill:"url(#path)"},svg);
el("ellipse",{cx:CLEARING.cx,cy:CLEARING.cy,rx:CLEARING.rx,ry:CLEARING.ry,fill:"none",stroke:"#a37e4f","stroke-width":2,opacity:.3},svg);
function onPath(x,y,m){
  const dx=(x-CLEARING.cx)/(CLEARING.rx+(m||16)), dy=(y-CLEARING.cy)/(CLEARING.ry+(m||16));
  if(dx*dx+dy*dy<1)return true;
  for(const q of PATHSAMP){if(Math.hypot(x-q.x,y-q.y)<q.w/2+(m||16))return true;}
  return false;
}


const world=el("g",{},svg);

const ABFLAG={ES:"🇪🇸",PT:"🇵🇹",FR:"🇫🇷",IT:"🇮🇹",EN:"🇬🇧",DE:"🇩🇪",RU:"🇷🇺",ZH:"🇨🇳",JA:"🇯🇵",KO:"🇰🇷"};
function acorn(g,x,y,s){s=s||1;el("path",{d:`M${x-6*s},${y} a${6*s},${6.4*s} 0 0 0 ${12*s},0 Z`,fill:"url(#acorn)"},g);el("ellipse",{cx:x,cy:y-1*s,rx:7*s,ry:3.6*s,fill:"#7a4b2e"},g);el("rect",{x:x-0.9*s,y:y-7*s,width:1.8*s,height:3.4*s,rx:0.9*s,fill:"#7a4b2e"},g);}
// language badge = an acorn with the abbreviation inside. green = learnable, gold = native mode available
// state: "full" = gold (native mode) · "learnable" = brown (studiable today)
//      · "planned" = pale, dashed (named in the family, NOT learnable yet)
//
// The third state exists because a built tree could previously only say "learnable" or say
// nothing at all. A language we intend to teach but haven't shipped had no honest way to
// appear: adding it as a leaf claimed it was studiable, and leaving it out made the family
// look smaller than it is. Pale + dashed reads as "the slot is there, it isn't filled yet",
// and it is light against the canopy so it stays legible at cover size.
function langAcorn(g,x,y,s,ab,state){s=s||1;const R=18.5*s;
  const native=state==="full", planned=state==="planned";
  const nut=native?"url(#goldNut)":planned?"url(#paleNut)":"url(#brownNut)";
  const cap=native?"#B5820F":planned?"#7E8C74":"#33220f";
  const rim=native?"#FDE38A":planned?"#EAF1E4":"#D8B98A";
  const txt=native?"#4a2f08":planned?"#3F4A38":"#ffffff";
  el("rect",{x:x-1.7*s,y:y-R-9*s,width:3.4*s,height:7.5*s,rx:1.7*s,fill:cap},g);                       // stem
  el("path",{d:`M${x-R*1.16},${y-R*0.38} Q ${x},${y-R*1.24} ${x+R*1.16},${y-R*0.38} Z`,fill:cap},g);   // cap dome
  el("path",{d:`M${x-R*1.16},${y-R*0.38} Q ${x},${y-R*1.24} ${x+R*1.16},${y-R*0.38}`,fill:"none",stroke:rim,"stroke-width":1.4*s,opacity:.85},g);
  el("ellipse",{cx:x-R*0.3,cy:y-R*0.66,rx:R*0.34,ry:R*0.14,fill:"#ffffff",opacity:.3},g);              // small cap shine (clear of text)
  el("path",Object.assign({d:`M${x-R},${y-R*0.4} C ${x-R},${y+R*0.86} ${x-R*0.45},${y+R*1.22} ${x},${y+R*1.22} C ${x+R*0.45},${y+R*1.22} ${x+R},${y+R*0.86} ${x+R},${y-R*0.4} Z`,fill:nut,stroke:rim,"stroke-width":1.6*s},
    planned?{"stroke-dasharray":`${3.2*s},${2.6*s}`}:{}),g);
  el("text",{x,y:y+R*0.52,"text-anchor":"middle","font-family":"'Baloo 2'","font-weight":800,"font-size":16*s*(ab.length>2?0.76:1),fill:txt},g).textContent=ab;}
function nameplate(g,x,y,s,text,leafy,gold){const fs=Math.max(13.5*s,12),w=text.length*(fs*0.6)+20,h=fs*1.75;
  el("rect",{x:x-w/2,y:y-h/2,width:w,height:h,rx:h/2,fill:gold?"url(#goldPlate)":(leafy?"rgba(24,66,45,.95)":"rgba(52,34,16,.96)"),stroke:gold?"#FFF3C4":(leafy?"#7BF0B6":"#D8B98A"),"stroke-width":gold?2.2:1.5},g);
  el("text",{x,y:y+fs*0.35,"text-anchor":"middle","font-family":"'Baloo 2'","font-weight":700,"font-size":fs,fill:gold?"#5a3d10":"#FFFFFF"},g).textContent=text;}

function bez3(p0,p1,p2,p3,t){const u=1-t;

// Roots are NOT separate strokes beside the trunk. #bark is a per-shape gradient
// (objectBoundingBox), so any separate root shape gets its own dark→light→dark
// ramp and shows a seam at the join — that is what made them read as loose

// One grouping, one trunk, a crown per constituent family.
// The trunk is a bent taper drawn as a SMOOTH closed curve (quadratic centreline,
// belly left, apex right) with a rounded base and a rounded shoulder, so nothing
// reads as a cut-off rectangle. The TOP crown sits on the apex and gets no
// branch — it IS the trunk.
function multiTree(g,x,gy,s,arms,fam,leafy){
  const top=arms.find(a=>a.role==="top")||arms[0];
  const trunkH=top.dy*s, cy=gy-trunkH, botW=30*s, topW=11*s, bendL=-34*s, bendT=26*s;
  const P=t=>{const u=1-t;return [u*u*x+2*u*t*(x+bendL)+t*t*(x+bendT), u*u*gy+2*u*t*(gy-trunkH*0.5)+t*t*cy];};
  const W=t=>topW+(botW-topW)*Math.pow(1-t,1.45);
  rootShadow(g,x,gy,botW);
  const N=40,L=[],R=[];
  for(let i=0;i<=N;i++){const t=i/N,p=P(t),w=W(t);L.push([p[0]-w,p[1]]);R.push([p[0]+w,p[1]]);}
  const apex=P(1), f2=n=>n.toFixed(1);
  const smooth=pts=>{let d="";for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];d+=" Q"+f2(a[0])+","+f2(a[1])+" "+f2((a[0]+b[0])/2)+","+f2((a[1]+b[1])/2);}return d;};
  el("path",{d:"M"+f2(L[0][0])+","+f2(L[0][1])+smooth(L)
      +" Q"+f2(apex[0]-topW)+","+f2(apex[1]-8*s)+" "+f2(apex[0])+","+f2(apex[1]-8*s)
      +" Q"+f2(apex[0]+topW)+","+f2(apex[1]-8*s)+" "+f2(R[R.length-1][0])+","+f2(R[R.length-1][1])
      +smooth(R.slice().reverse())
      +skirt(x,gy,botW)+" Z",fill:"url(#bark)"},g);
  rootTufts(g,x,gy,botW);
  // side limbs leave the bent trunk at their own height and run up INTO the foliage
  arms.filter(a=>a.role==="side").forEach(a=>{
    const cx=x+a.dx*s, ccy=gy-a.dy*s, sgn=a.dx>=0?1:-1;
    const t=Math.max(0.10,Math.min(0.62,(a.dy*0.46)/top.dy)), tp=P(t);
    const p0=[tp[0]+sgn*W(t)*0.5, tp[1]];
    const p3=[cx-a.dx*0.22*s, ccy+a.ch*0.30*s];
    const p1=[p0[0]+(p3[0]-p0[0])*0.44, p0[1]-4*s];
    const p2=[p3[0]-(p3[0]-p0[0])*0.28, p3[1]+54*s];
    const d="M"+p0[0]+","+p0[1]+" C"+p1[0]+","+p1[1]+" "+p2[0]+","+p2[1]+" "+p3[0]+","+p3[1];
    // a shoulder where the limb leaves the trunk, so the join is a fillet not a butt
    el("ellipse",{cx:p0[0],cy:p0[1],rx:9*s,ry:7.5*s,fill:"url(#bark)"},g);
    el("path",{d,stroke:"#5f4029","stroke-width":10.5*s,fill:"none","stroke-linecap":"round"},g);
    el("path",{d,stroke:"url(#bark)","stroke-width":7.2*s,fill:"none","stroke-linecap":"round"},g);
    // Support branch: leaves the limb tangentially (so the join flows rather
    // than sticks on), sits on the OUTSIDE of the bend where a real prop branch
    // would, and sweeps UP to finish inside the foliage it is holding up — the
    // crown draws after it, so the tip disappears into the leaves.
    const ts=0.30, B=bez3(p0,p1,p2,p3,ts), D=bez3d(p0,p1,p2,p3,ts);
    const dl=Math.hypot(D[0],D[1])||1, U=[D[0]/dl,D[1]/dl];
    const tip=[cx+sgn*a.cw*s*0.42, ccy+a.ch*s*0.16];
    const q1=[B[0]+U[0]*30*s, B[1]+U[1]*30*s+13*s];
    const q2=[tip[0]-sgn*a.cw*s*0.06, tip[1]+a.ch*s*0.92];
    const sd="M"+B[0]+","+B[1]+" C"+q1[0]+","+q1[1]+" "+q2[0]+","+q2[1]+" "+tip[0]+","+tip[1];
    el("ellipse",{cx:B[0],cy:B[1],rx:3.2*s,ry:2.8*s,fill:"url(#bark)"},g);
    el("path",{d:sd,stroke:"#5f4029","stroke-width":5.0*s,fill:"none","stroke-linecap":"round"},g);
    el("path",{d:sd,stroke:"url(#bark)","stroke-width":3.2*s,fill:"none","stroke-linecap":"round"},g);});
  arms.forEach((a,i)=>{
    const cx=(a.role==="top"?apex[0]:x+a.dx*s), ccy=gy-a.dy*s, w=a.cw*s, h=a.ch*s;
    crown(g,cx,ccy,w,h,false,i%2);
    const lf=a.leafs||[],pos=TAGPOS[lf.length]||TAGPOS[4];
    const shr=lf.length>4?0.82:1;
    lf.forEach((l,k)=>{const rel=pos[k%pos.length];langAcorn(g,cx+rel[0]*w*0.44,ccy-rel[1]*h*0.44,s*0.84*shr,l.ab,l.acorn||"learnable");});
    ARMPLATES.push({x:cx,y:ccy+0.17*h+0.248*w-4*s,s:s*0.66,fam:a.name});});
  PLATES.push({x:x,y:gy+18*s,s:Math.max(s,0.66),fam:fam,leafy:(leafy!==false)});
}
