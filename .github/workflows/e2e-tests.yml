name: E2E tests

# Runs on every push to main or beta, and on pull requests targeting either.
# This sandbox that helped build this suite couldn't actually run it (its
# network config blocks downloading a real browser) -- this is where these
# tests get their first real run, since GitHub's runners have full internet
# access.
on:
  push:
    branches: [main, beta, dev]
  pull_request:
    branches: [main, beta, dev]

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build the app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_ADMIN_EMAIL: ${{ secrets.NEXT_PUBLIC_ADMIN_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_ADMIN_EMAIL: ${{ secrets.NEXT_PUBLIC_ADMIN_EMAIL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          # REQUIRED in CI. These were once optional, on the theory that the
          # workflow was "still useful" without them -- but the authenticated
          # suite (6 of 20 tests) then skipped silently in every run, and the
          # board showed green while a third of the suite tested nothing.
          # e2e/authenticated-flow.spec.js now FAILS in CI when either is
          # absent. Both live under the "Production" Environment, which this
          # job declares above. Setup: docs/manual-runbook.md §9.
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      # Two artifacts on purpose. playwright-report/ is the browsable HTML
      # report; test-results/ is where the per-failure screenshot, trace.zip and
      # error-context.md (an accessibility snapshot of the page at the moment the
      # assertion gave up) actually live -- that's the one you want when a test
      # fails in CI and passes locally. Both need `if: always()`, since the
      # interesting case is a failed run.
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload failure artifacts (screenshots, traces, error context)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
